name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test Orbit.Tests/Orbit.Tests.csproj -c Release --logger "console;verbosity=minimal"
      - run: dotnet publish Orbit.csproj -c Release -r win-x64 --self-contained false -p:DebugType=None -p:DebugSymbols=false -o publish
